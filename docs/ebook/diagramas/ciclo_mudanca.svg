<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722.24 324" width="722.24" height="324" role="img" aria-label="Roteiro seguro para criar ou alterar uma funcionalidade" font-family="Inter, 'DejaVu Sans', sans-serif">
