<path d="M18.0,37.0 L32.0,29.0 L266.71999999999997,29.0 L266.71999999999997,79.0 L18.0,79.0 Z" fill="#EEF3F8" stroke="#4A6380" stroke-width="1.6"/>
<text x="142.35999999999999" y="50.8" font-size="12" font-weight="600" text-anchor="middle" fill="#1D2A3A">Corpo da resposta (texto JSON)</text>
<text x="142.35999999999999" y="65.8" font-size="12" font-weight="500" text-anchor="middle" fill="#1D2A3A">{&quot;value&quot;: [ {...}, {...} ]}</text>
<rect x="18.0" y="101.0" width="248.71999999999997" height="50" rx="7" fill="#FFFFFF" stroke="#3B4250" stroke-width="1.6"/>
<text x="142.35999999999999" y="122.8" font-size="12" font-weight="600" text-anchor="middle" fill="#1D2026">odata.extrair_pagina()</text>
<text x="142.35999999999999" y="137.8" font-size="12" font-weight="500" text-anchor="middle" fill="#1D2026">→ lista de registros (dicts)</text>
<rect x="18.0" y="173.0" width="248.71999999999997" height="50" rx="7" fill="#FFFFFF" stroke="#3B4250" stroke-width="1.6"/>
<text x="142.35999999999999" y="194.8" font-size="12" font-weight="600" text-anchor="middle" fill="#1D2026">obter_campo() pelos nomes</text>
<text x="142.35999999999999" y="209.8" font-size="12" font-weight="500" text-anchor="middle" fill="#1D2026">mapeados em config/api.json</text>
<rect x="18.0" y="245.0" width="248.71999999999997" height="50" rx="7" fill="#FFFFFF" stroke="#3B4250" stroke-width="1.6"/>
<text x="142.35999999999999" y="266.8" font-size="12" font-weight="600" text-anchor="middle" fill="#1D2026">como_texto() / como_quantidade()</text>
<text x="142.35999999999999" y="281.8" font-size="12" font-weight="500" text-anchor="middle" fill="#1D2026">→ valores + chave do item</text>
<rect x="18.0" y="317.0" width="248.71999999999997" height="50" rx="7" fill="#FFFFFF" stroke="#3B4250" stroke-width="1.6"/>
<text x="142.35999999999999" y="338.8" font-size="12" font-weight="600" text-anchor="middle" fill="#1D2026">auditoria.consolidar()</text>
<text x="142.35999999999999" y="353.8" font-size="12" font-weight="500" text-anchor="middle" fill="#1D2026">→ LinhaMensagem (valores finais)</text>
<rect x="18.0" y="389.0" width="248.71999999999997" height="50" rx="7" fill="#E7F5EE" stroke="#1E8E52" stroke-width="2.6"/>
<text x="142.35999999999999" y="410.8" font-size="12" font-weight="600" text-anchor="middle" fill="#0F4D2C">Linha da aba Dados</text>
<text x="142.35999999999999" y="425.8" font-size="11" font-weight="500" text-anchor="middle" fill="#5F636B">(com &quot;-&quot; onde não há valor)</text>
<rect x="330.71999999999997" y="101.0" width="241.76" height="50" rx="4" fill="#FFFFFF" stroke="#B9BCC2" stroke-width="1" stroke-dasharray="3 3"/>
<text x="451.59999999999997" y="122.8" font-size="12" font-weight="600" text-anchor="middle" fill="#5F636B">V2: {&quot;d&quot;:{&quot;results&quot;:[...]}}</text>
<text x="451.59999999999997" y="137.8" font-size="12" font-weight="500" text-anchor="middle" fill="#5F636B">V4: {&quot;value&quot;:[...]}</text>
<rect x="330.71999999999997" y="173.0" width="241.76" height="50" rx="4" fill="#FFFFFF" stroke="#B9BCC2" stroke-width="1" stroke-dasharray="3 3"/>
<text x="451.59999999999997" y="194.8" font-size="12" font-weight="600" text-anchor="middle" fill="#5F636B">material ← &quot;material&quot;</text>
<text x="451.59999999999997" y="209.8" font-size="12" font-weight="500" text-anchor="middle" fill="#5F636B">quantidade ← &quot;quantidade&quot;</text>
<rect x="330.71999999999997" y="245.0" width="241.76" height="50" rx="4" fill="#FFFFFF" stroke="#B9BCC2" stroke-width="1" stroke-dasharray="3 3"/>
<text x="451.59999999999997" y="266.8" font-size="12" font-weight="600" text-anchor="middle" fill="#5F636B">&quot;000000000022026169&quot; fica texto</text>
<text x="451.59999999999997" y="281.8" font-size="12" font-weight="500" text-anchor="middle" fill="#5F636B">&quot;1e+0&quot; → 1 (Decimal exato)</text>
<rect x="330.71999999999997" y="317.0" width="241.76" height="50" rx="4" fill="#FFFFFF" stroke="#B9BCC2" stroke-width="1" stroke-dasharray="3 3"/>
<text x="451.59999999999997" y="338.8" font-size="12" font-weight="600" text-anchor="middle" fill="#5F636B">notas por campo: divergente,</text>
<text x="451.59999999999997" y="353.8" font-size="12" font-weight="500" text-anchor="middle" fill="#5F636B">não obtido, ambígua</text>
</svg>